name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: aihappey-ai

    steps:
      - name: Checkout AI Gateway
        uses: actions/checkout@v4
        with:
          path: aihappey-ai

      - name: Checkout Responses
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-responses
          path: aihappey-responses

      - name: Checkout Vercel
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-vercel
          path: aihappey-vercel

      - name: Checkout OpenAI
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-openai
          path: aihappey-openai

      - name: Checkout Messages
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-messages
          path: aihappey-messages

      - name: Checkout Interactions
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-interactions
          path: aihappey-interactions

      - name: Checkout ChatCompletions
        uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-chatcompletions
          path: aihappey-chatcompletions

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Run tests
        run: dotnet test .\Core\AIHappey.Tests\AIHappey.Tests.csproj -c Release

      # Preserve the existing standalone single-file build.
      - name: Publish Windows gateway
        shell: pwsh
        run: |
          dotnet publish .\Samples\AIHappey.Windows\AIHappey.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:WarningLevel=0 `
            -clp:ErrorsOnly `
            -o .\artifacts\windows
          if ($LASTEXITCODE -ne 0) { throw 'Standalone gateway publish failed.' }

      - name: Zip executable
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\windows\* `
            -DestinationPath .\artifacts\aihappey-windows-x64.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest
          path: aihappey-ai/artifacts/aihappey-windows-x64.zip
          if-no-files-found: error

      # Multi-file publish matches aihappey-windows/publish.ps1 runtime checks.
      - name: Publish reusable desktop gateway runtime
        shell: pwsh
        run: |
          $output = '.\artifacts\desktop-runtime'
          dotnet publish .\Samples\AIHappey.Windows\AIHappey.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -clp:ErrorsOnly `
            -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Desktop gateway publish failed.' }
          foreach ($file in @(
            'AIHappey.Windows.exe',
            'AIHappey.Windows.dll',
            'AIHappey.Windows.deps.json',
            'AIHappey.Windows.runtimeconfig.json',
            'appsettings.json'
          )) {
            if (-not (Test-Path (Join-Path $output $file) -PathType Leaf)) {
              throw "Missing gateway runtime file: $file"
            }
          }
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
          } | ConvertTo-Json | Set-Content (Join-Path $output 'build-info.json') -Encoding utf8
          Compress-Archive `
            -Path "$output\*" `
            -DestinationPath .\artifacts\aihappey-ai-runtime-win-x64.zip `
            -Force

      - name: Upload reusable desktop gateway runtime
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-ai-win-x64
          path: aihappey-ai/artifacts/aihappey-ai-runtime-win-x64.zip
          if-no-files-found: error

  release-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: latest
          path: .\artifacts

      - name: Download reusable desktop gateway runtime
        uses: actions/download-artifact@v4
        with:
          name: desktop-runtime-ai-win-x64
          path: .\artifacts

      - name: Update latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push origin latest --force

          if (gh release view latest 2>$null) {
            gh release upload latest .\artifacts\aihappey-windows-x64.zip --clobber
          } else {
            gh release create latest .\artifacts\aihappey-windows-x64.zip `
              --title "Latest Windows build" `
              --notes "Latest standalone Windows gateway build from main."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Standalone release update failed.' }

          gh release upload latest .\artifacts\aihappey-ai-runtime-win-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Desktop gateway runtime release update failed.' }
