name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test .\Core\AIHappey.Tests\AIHappey.Tests.csproj -c Release --verbosity minimal

      - name: Publish Windows gateway
        shell: pwsh
        run: |
          dotnet publish .\Samples\AIHappey.Windows\AIHappey.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:WarningLevel=0 `
            -clp:ErrorsOnly `
            -o .\artifacts\windows

      - name: Zip executable
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\windows\* `
            -DestinationPath .\artifacts\aihappey-windows-x64.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest
          path: .\artifacts\aihappey-windows-x64.zip

  release-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-pack
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: latest
          path: .\artifacts

      - name: Update latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push origin latest --force

          if (gh release view latest 2>$null) {
            gh release upload latest .\artifacts\aihappey-windows-x64.zip --clobber
          } else {
            gh release create latest .\artifacts\aihappey-windows-x64.zip `
              --title "Latest Windows build" `
              --notes "Latest standalone Windows gateway build from main."
          }